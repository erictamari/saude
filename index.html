<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha Saúde</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Chart.js para gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Menu Lateral -->
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <h2>🩺 Minha Saúde</h2>
      </div>
      <nav class="nav">
        <ul>
          <li class="nav-item active" data-page="dashboard">
            <span class="icon">📊</span> Dashboard
          </li>
          <li class="nav-item" data-page="exames-sangue">
            <span class="icon">🧪</span> Exames de Sangue
          </li>
          <li class="nav-divider">Especialidades</li>
          <!-- As especialidades serão inseridas via JS -->
          <div id="especialidades-list"></div>
        </ul>
      </nav>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="main-content">
      <header class="top-header">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="header-actions">
          <span class="date-display" id="currentDate"></span>
        </div>
      </header>
      <section class="content" id="contentArea">
        <!-- O conteúdo será renderizado dinamicamente -->
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
