<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha Saúde - Sistema de Gestão</title>
  <!-- Chart.js para gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">🩺</span>
        <span class="brand-text">Minha Saúde</span>
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li class="nav-item active" data-view="dashboard">
            <span class="nav-icon">📊</span>
            <span class="nav-label">Dashboard</span>
          </li>
          <li class="nav-item" data-view="exames-sangue">
            <span class="nav-icon">🧪</span>
            <span class="nav-label">Exames de Sangue</span>
          </li>
          <li class="nav-divider">Especialidades</li>
          <div id="especialidades-menu"></div>
          <li class="nav-divider">Sistema</li>
          <li class="nav-item" data-view="configuracoes">
            <span class="nav-icon">⚙️</span>
            <span class="nav-label">Configurações</span>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">
      <!-- TOP HEADER -->
      <header class="top-header">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="header-actions">
          <span class="date-display" id="currentDate"></span>
          <button class="btn-icon" id="refreshBtn" title="Atualizar">⟳</button>
        </div>
      </header>

      <!-- ÁREA DE CONTEÚDO DINÂMICO -->
      <section class="content-area" id="contentArea">
        <!-- Renderizado via JS -->
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
